[package]
name = "rumpl"
version = "0.1.0"
edition = "2024"
description = "Sample-free General MIDI player and renderer"
license = "ISC"
repository = "https://github.com/ad-si/rumpl"
keywords = ["midi", "synth", "audio", "cli", "general-midi"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "rumpl"
path = "src/lib.rs"

[[bin]]
name = "rumpl"
path = "src/main.rs"
required-features = ["cli", "play"]

[features]
default = ["cli", "play"]
cli = ["dep:clap"]
play = ["dep:cpal", "dep:ringbuf"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
midly = "0.5"
hound = "3"
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
